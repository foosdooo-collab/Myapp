name: Build Android APK with p4a

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Checkout python-for-android
        uses: actions/checkout@v4
        with:
          repository: kivy/python-for-android
          path: p4a-source

      - name: Build p4a Docker image
        run: docker build -t p4a ./p4a-source

      - name: Build Android APK
        run: |
          mkdir -p bin

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/user/app" \
            --workdir /home/user/app \
            p4a \
            sh -c '
              . /home/user/p4a/venv/bin/activate 2>/dev/null ||
              . /home/user/venv/bin/activate 2>/dev/null ||
              true

              p4a apk \
                --private /home/user/app \
                --package org.example.myapp \
                --name "Myapp" \
                --version 0.1 \
                --bootstrap sdl2 \
                --requirements python3,kivy \
                --arch arm64-v8a \
                --sdk-dir "$ANDROID_SDK_HOME" \
                --ndk-dir "$ANDROID_NDK_HOME"
            '

      - name: Collect APK
        run: |
          find . -type f -name '*.apk' \
            -not -path './p4a-source/*' \
            -exec cp {} bin/ \;

          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
