name: Build Android APK with p4a

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Checkout python-for-android
        uses: actions/checkout@v4
        with:
          repository: kivy/python-for-android
          path: p4a-source

      - name: Build p4a Docker image
        run: docker build -t p4a ./p4a-source

      - name: Verify p4a environment
        run: |
          docker run --rm p4a sh -c '
            pwd
            ls -la
            ls -la venv/bin/activate
            . venv/bin/activate
            p4a --version
            echo "ANDROID_SDK_HOME=$ANDROID_SDK_HOME"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          '

      - name: Build Android APK
        run: |
          set -euxo pipefail
          mkdir -p bin

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/user/myapp" \
            p4a sh -c '
              set -eu
              . venv/bin/activate
              cd /home/user/myapp

              p4a apk \
                --private /home/user/myapp \
                --package=org.example.myapp \
                --name="Myapp" \
                --version=0.1 \
                --bootstrap=sdl2 \
                --requirements=python3,kivy \
                --arch=arm64-v8a \
                --sdk-dir="$ANDROID_SDK_HOME" \
                --ndk-dir="$ANDROID_NDK_HOME"
            '

          find . -type f -name '*.apk' \
            -not -path './p4a-source/*' \
            -not -path './bin/*' \
            -exec cp -f {} bin/ \;

          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
