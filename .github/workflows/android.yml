name: Build Android APK with p4a

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Checkout python-for-android
        uses: actions/checkout@v4
        with:
          repository: kivy/python-for-android
          path: p4a-source

      - name: Build p4a Docker image
        run: docker build -t p4a ./p4a-source

      - name: Verify p4a environment
        run: |
          docker run --rm p4a sh -c '
            pwd
            ls -la
            ls -la venv/bin/activate
            . venv/bin/activate
            p4a --version
            echo "ANDROID_SDK_HOME=$ANDROID_SDK_HOME"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          '

      - name: Build Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bin

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/user/myapp" \
            p4a sh -c '
              set -eu
              . venv/bin/activate

              echo "Searching for Android SDK tools..."
              SDKMANAGER="$(find /home/user /opt -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

              if [ -z "$SDKMANAGER" ]; then
                echo "ERROR: sdkmanager was not found in the container."
                find /home/user/.android /opt -maxdepth 4 -type d 2>/dev/null | head -n 100
                exit 1
              fi

              case "$SDKMANAGER" in
                */cmdline-tools/*/bin/sdkmanager)
                  SDK_DIR="${SDKMANAGER%%/cmdline-tools/*}"
                  ;;
                */tools/bin/sdkmanager)
                  SDK_DIR="${SDKMANAGER%%/tools/bin/sdkmanager}"
                  ;;
                *)
                  echo "ERROR: Cannot determine SDK root from $SDKMANAGER"
                  exit 1
                  ;;
              esac

              echo "SDK manager: $SDKMANAGER"
              echo "SDK directory: $SDK_DIR"

              NDK_PROP="$(find "$SDK_DIR" /opt /home/user -type f \
                -path "*/ndk/*/source.properties" 2>/dev/null | head -n 1 || true)"

              if [ -z "$NDK_PROP" ]; then
                echo "No installed NDK found. Installing Android NDK..."
                yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" \
                  "ndk;28.2.13676358" \
                  "platform-tools" \
                  "platforms;android-35" \
                  "build-tools;35.0.0"
                NDK_PROP="$(find "$SDK_DIR" -type f \
                  -path "*/ndk/*/source.properties" 2>/dev/null | head -n 1 || true)"
              fi

              test -n "$NDK_PROP" || {
                echo "ERROR: Android NDK installation failed."
                exit 1
              }

              NDK_DIR="$(dirname "$NDK_PROP")"
              echo "NDK directory: $NDK_DIR"

              cd /home/user/myapp

              p4a apk \
                --private /home/user/myapp \
                --package=org.example.myapp \
                --name="Myapp" \
                --version=0.1 \
                --bootstrap=sdl2 \
                --requirements=python3,kivy \
                --arch=arm64-v8a \
                --android-api=35 \
                --sdk-dir="$SDK_DIR" \
                --ndk-dir="$NDK_DIR"

              find /home/user/myapp -type f -name "*.apk" \
                -not -path "*/p4a-source/*" \
                -exec cp -f {} /home/user/myapp/bin/ \;
            '

          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
