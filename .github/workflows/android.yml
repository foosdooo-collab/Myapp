name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Prepare directories
        run: mkdir -p bin .buildozer

      - name: Build Docker image
        run: docker build -t my-buildozer:latest .

      - name: Build Android APK
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            -v "$GITHUB_WORKSPACE/.buildozer:/home/user/.buildozer" \
            -w /home/user/hostcwd \
            my-buildozer:latest \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
