name: Android APK (Docker Buildozer)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build debug APK in Buildozer Docker image
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            -w /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            -c '
              if [ "$(id -u)" = 0 ]; then
                if id user >/dev/null 2>&1; then
                  exec su user -c "buildozer android debug"
                elif command -v gosu >/dev/null 2>&1; then
                  exec gosu 1000:1000 buildozer android debug
                else
                  echo "Container has no non-root user/gosu; cannot safely run Buildozer" >&2
                  exit 1
                fi
              else
                exec buildozer android debug
              fi
            '

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 14
