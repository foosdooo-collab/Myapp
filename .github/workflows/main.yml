name: Build Kivy 32-bit Android App via Docker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0
  BUILDOZER_ALLOW_ORG_TEST_DOMAIN: '1'

jobs:
  build:
    name: Docker Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Cache Buildozer Global Data
        id: cache-buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          # The cache updates whenever buildozer.spec changes
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Inject Android 14 and 32-bit System Variables
        shell: bash
        run: |
          if [ ! -f buildozer.spec ]; then 
            # Run buildozer init inside Docker just to generate a default spec if missing
            docker run --rm -v ${{ github.workspace }}:/home/user/hostdir kivy/buildozer init
          fi
          
          # Force target API to Android 14 (API 34)
          sed -i.bak 's/^#\? *android.api =.*/android.api = 34/' buildozer.spec
          
          # Force architecture compile down strictly to 32-bit ARM (armeabi-v7a)
          sed -i.bak 's/^#\? *android.archs =.*/android.archs = armeabi-v7a/' buildozer.spec
          
          # Automatically accept SDK licenses to prevent build freezes
          sed -i.bak 's/^#\? *android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec

      - name: Compile Debug APK via Buildozer Docker Container
        run: |
          # We pass local caches and the workspace directly into the container
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostdir \
            -v ~/.buildozer:/home/user/.buildozer \
            kivy/buildozer android debug

      - name: Archive Built Packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kivy-Docker-Android14-32bit-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
