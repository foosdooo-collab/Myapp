name: Android APK (Docker Buildozer)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build debug APK in Buildozer Docker image
        uses: docker://ghcr.io/kivy/buildozer:latest
        with:
          args: android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 14
