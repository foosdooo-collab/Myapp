services:
  buildozer:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-buildozer:latest
    working_dir: /home/user/hostcwd
    volumes:
      - .:/home/user/hostcwd
      - buildozer-cache:/home/user/.buildozer
    environment:
      - BUILDOZER_WARN_ON_ROOT=0
    command: buildozer android debug

volumes:
  buildozer-cache:
